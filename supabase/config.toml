# Only these hosted settings are managed here. Unspecified services remain unchanged.
project_id = "lotline"

[auth]
site_url = "https://lotlinesolana.vercel.app"
additional_redirect_urls = [
  "https://lotlinesolana.vercel.app/auth/callback",
  "https://lotlinesolana.vercel.app/auth/callback?next=/auth/update-password",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/callback?next=/auth/update-password",
  "http://127.0.0.1:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback?next=/auth/update-password",
]
minimum_password_length = 12

[auth.email]
enable_confirmations = true
