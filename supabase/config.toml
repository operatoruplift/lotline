# Only these hosted settings are managed here. Unspecified services remain unchanged.
project_id = "lotline"

[auth]
site_url = "https://lotline.dev"
# Only the production host and the two aliases attached to the Vercel project. A retired
# deployment or a local port on this list would let a sign-in link land somewhere Lotline
# no longer controls; add a local callback to a development project, never here.
additional_redirect_urls = [
  "https://lotline.dev",
  "https://lotline.dev/auth/callback",
  "https://lotline.dev/auth/callback?next=/auth/update-password",
  "https://lotlineonsolana.vercel.app",
  "https://lotlineonsolana.vercel.app/auth/callback",
  "https://lotlineonsolana.vercel.app/auth/callback?next=/auth/update-password",
  "https://lotlinesolana.vercel.app",
  "https://lotlinesolana.vercel.app/auth/callback",
  "https://lotlinesolana.vercel.app/auth/callback?next=/auth/update-password",
]
minimum_password_length = 12

[auth.email]
enable_confirmations = true
