name: Verify Lotline
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Non-secret fixtures; browser tests intercept every account request.
      NEXT_PUBLIC_SUPABASE_URL: https://auth-fixture.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture
      NEXT_PUBLIC_AUTH_EMAIL_ENABLED: 'false'
      SUPABASE_SECRET_KEY: ''
      LOTLINE_SHARED_LIMITS: 'false'
      TOKENS_XYZ_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # Keep npm 11 aligned with the checked-in lockfile. npm ci validates
      # dependency resolution before applying omit flags, so a runner default
      # on a different major reads the lockfile as out of sync (it reports
      # utf-8-validate, an optional native dep of ws, as missing).
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test the production PWA
        run: |
          npm run start -- --port 3100 --hostname 127.0.0.1 > /tmp/lotline-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3100
          E2E_PRODUCTION: 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
